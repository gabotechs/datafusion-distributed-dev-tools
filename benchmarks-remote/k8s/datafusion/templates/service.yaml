apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: benchmark-datafusion
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}-worker
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-workers
  namespace: benchmark-datafusion
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Values.name }}-worker
  ports:
    - name: grpc
      port: 9001
      targetPort: grpc
