name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pr-bot/package-lock.json
            benchmarks-remote/package-lock.json
      - run: npm ci
      - run: npm --prefix pr-bot ci
      - run: npm --prefix benchmarks-remote ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
