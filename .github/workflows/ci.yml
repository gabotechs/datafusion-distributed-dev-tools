name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # The repository .npmrc silences npm to keep benchmark stdout clean; CI
      # keeps npm's own warnings and errors.
      npm_config_loglevel: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmark-bot/package-lock.json
            benchmarks-remote/package-lock.json
      - run: npm ci
      - run: npm --prefix benchmark-bot ci
      - run: npm --prefix benchmarks-remote ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
